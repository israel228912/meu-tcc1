<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCC - Bem Estar</title>
<style>
body{font-family:Arial;margin:0;background:#f0f4f8}
header{background:#4a148c;color:white;padding:30px;text-align:center}
.container{max-width:800px;margin:auto;padding:20px}
.card{background:white;padding:20px;border-radius:12px;margin:15px 0}
img{width:100%;border-radius:12px}
button{background:#4a148c;color:white;border:none;padding:12px 20px;border-radius:8px;font-size:16px;cursor:pointer}
#frase{margin-top:20px;font-size:22px;font-weight:bold;color:#4a148c;display:none;background:white;padding:15px;border-radius:10px}
</style>
</head>
<body>
<header><h1>Os 5 Eixos do Bem-Estar</h1></header>
<div class="container">
<img src="foto.jpg">
<div class="card" style="text-align:center">
<h2>Mensagem Final</h2>
<button onclick="document.getElementById('frase').style.display='block'; document.getElementById('frase').innerHTML='Não desista, você pode chegar nos seus objetivos! 💜'">Clique aqui ✨</button>
<p id="frase"></p>
</div>
</div>
</body>
</html>
